<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusvanir Vault Wiki</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="logo">
                <h1>Nusvanir</h1>
                <span>Wiki Database</span>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari entitas, monster, ras...">
            </div>
            <nav id="categoryNav">
                <!-- Categories injected by JS -->
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="top-bar glass-panel">
                <h2 id="pageTitle">Halaman Utama</h2>
            </div>
            
            <div class="content-area" id="contentArea">
                <!-- Content injected by JS -->
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="marked.min.js"></script>
    <script src="database.js"></script>
    <script src="app.js"></script>
</body>
</html>
